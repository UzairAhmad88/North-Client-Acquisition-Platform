services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uzaii
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uzaii"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/uzaii
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me
      REAL_SEND: "false"
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
